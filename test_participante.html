body{font-family:'Segoe UI','Calibri',sans-serif;background:#EEF1F5;color:#1A1A2E;font-size:15px;min-height:100vh}
.topbar{background:#0D1B2A;display:flex;align-items:stretch}

.app{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.step-bar{display:flex;align-items:center;margin-bottom:24px}
.sb-item{display:flex;align-items:center;gap:6px;flex:1}
.sb-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #D0D8E4;color:#B0BCC8;background:#fff;flex-shrink:0;transition:all .3s}
.sb-num.done{background:#0D1B2A;border-color:#0D1B2A;color:#fff}
.sb-num.act{background:#C4973B;border-color:#C4973B;color:#fff}
.sb-lbl{font-size:11px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.sb-lbl.act,.sb-lbl.done{color:#0D1B2A}
.sb-line{flex:1;height:2px;background:#D0D8E4;margin:0 8px}
.sb-line.done{background:#0D1B2A}
.panel{display:none}.panel.act{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #D8DFE8;border-radius:4px;padding:20px 22px;margin-bottom:14px}

.sec-label{font-size:10px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}

.sec-sub{font-size:14px;color:#6B7A8D;line-height:1.65}
.inp{border:1px solid #D0D8E4;border-radius:3px;padding:9px 12px;font-size:14px;font-family:inherit;background:#FAFBFC;color:#1A1A2E;width:100%}
.inp:focus{outline:none;border-color:#0D1B2A;background:#fff}
.btn{border:1px solid #D0D8E4;border-radius:3px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;transition:all .15s}
.btn-primary{background:#0D1B2A;color:#fff;border-color:#0D1B2A}
.btn-primary:hover{background:#1A3248}
.btn-ghost{background:#fff;color:#6B7A8D;border-color:#D0D8E4}
.btn-ghost:hover{border-color:#0D1B2A;color:#0D1B2A}
.test-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.col-head{text-align:center;padding:8px 4px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:#F4F6F8;color:#6B7A8D}
.renglon-wrap{margin-bottom:10px}
.renglon-num{font-size:10px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;text-align:center}
.renglon{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opcion{background:#F8F9FB;border:1.5px solid #E2E8F0;border-radius:3px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .18s;font-size:13px;color:#6B7A8D;user-select:none;position:relative;font-weight:500;line-height:1.3}
.opcion:hover{border-color:#0D1B2A;color:#0D1B2A;background:#fff}
.opcion.pos{border-color:#2E6B8A;background:#EAF3F8;color:#1A4F6B;font-weight:600}
.opcion.neg{border-color:#8A3A2E;background:#F8EDEA;color:#6B2820;font-weight:600}
.opcion.pos::after{content:"+1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#2E6B8A}
.opcion.neg::after{content:"-1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#8A3A2E}
.prog-wrap{margin-bottom:16px}
.prog-label{font-size:12px;color:#6B7A8D;margin-bottom:5px}

.score-val{font-size:22px;font-weight:700;display:block;line-height:1}

function pge(id){return document.getElementById(id);}
function pmk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d;}

function calcScore(){var sc={agua:0,fuego:0,tierra:0,aire:0};Object.keys(S.respuestas).forEach(function(k){var p=k.split("-"),elem=ECOLS[parseInt(p[1])];sc[elem]+=S.respuestas[k];});return sc;}
function renglonOK(r){var pos=0,neg=0;for(var c=0;c<4;c++){var v=S.respuestas[r+"-"+c];if(v===1)pos++;if(v===-1)neg++;}return pos===1&&neg===1;}
function countOK(){var n=0;for(var r=0;r<10;r++)if(renglonOK(r))n++;return n;}
function calcResultado(sc){
  var orden=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[b]-sc[a];});
  var negs=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[a]-sc[b];});
  return{scores:sc,principal:orden[0],complemento:orden[1],opuesto:negs[0]};
}

function renderStepBar(){
  var bar=pge("step-bar");bar.innerHTML="";
  STEPS.forEach(function(lbl,i){
    if(i>0){var ln=pmk("div","sb-line"+(i<=PASO?" done":""));bar.appendChild(ln);}
    var item=pmk("div","sb-item");
    var num=pmk("div","sb-num"+(i===PASO?" act":i<PASO?" done":""),i<PASO?"✓":String(i+1));
    var ltxt=pmk("span","sb-lbl"+(i<=PASO?" act":""),lbl);
    item.appendChild(num);item.appendChild(ltxt);bar.appendChild(item);
  });
}
function irA(i){PASO=i;renderStepBar();document.querySelectorAll(".panel").forEach(function(p,j){p.classList.toggle("act",j===i);});window.scrollTo({top:0,behavior:"smooth"});}

  var i1=document.createElement("input");i1.className="inp";i1.id="inNom";i1.placeholder="Tu nombre completo";

  var g2=pmk("div");g2.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px";
  var fg2=pmk("div");var l2=pmk("label");l2.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l2.textContent="Cargo";var i2=document.createElement("input");i2.className="inp";i2.id="inCargo";i2.placeholder="Tu cargo";fg2.appendChild(l2);fg2.appendChild(i2);
  var fg3=pmk("div");var l3=pmk("label");l3.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l3.textContent="Área / Equipo";var i3=document.createElement("input");i3.className="inp";i3.id="inArea";i3.placeholder="Tu área o equipo";fg3.appendChild(l3);fg3.appendChild(i3);
  g2.appendChild(fg2);g2.appendChild(fg3);form.appendChild(g2);
  var g3=pmk("div");g3.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px";

  var fg5=pmk("div");var l5=pmk("label");l5.style.cssText="font-size:11px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px";l5.textContent="Correo electrónico *";var i5=document.createElement("input");i5.className="inp";i5.id="inCorreo";i5.placeholder="Tu correo electrónico";i5.type="email";fg5.appendChild(l5);fg5.appendChild(i5);

function buildTest(){
  var p=pge("p1");p.innerHTML="";
  var hdr=pmk("div","card card-accent");
  hdr.appendChild(pmk("div","sec-label","10 renglones · 2 selecciones por renglon"));
  hdr.appendChild(pmk("div","sec-title","El test"));
  hdr.appendChild(pmk("div","sec-sub","Marca +1 en la palabra que MÁS te identifica y −1 en la que MENOS te identifica."));
  p.appendChild(hdr);
  var pw=pmk("div","prog-wrap");
  var pl=pmk("div","prog-label","0 de 10 renglones completados");pl.id="prog-lbl";
  var pt=pmk("div","prog-track");var pf=pmk("div","prog-fill");pf.id="prog-fill";pf.style.width="0%";
  pt.appendChild(pf);pw.appendChild(pl);pw.appendChild(pt);p.appendChild(pw);
  var head=pmk("div","test-cols");
  ["A","B","C","D"].forEach(function(ltr){head.appendChild(pmk("div","col-head","Columna "+ltr));});
  p.appendChild(head);
  RENGLONES.forEach(function(ren,r){
    var wrap=pmk("div","renglon-wrap");
    wrap.appendChild(pmk("div","renglon-num","Renglon "+(r+1)));
    var row=pmk("div","renglon");
    for(var c=0;c<4;c++){
      var key=r+"-"+c;var op=pmk("div","opcion",ren[c]);op.setAttribute("data-key",key);
      var cur=S.respuestas[key];if(cur===1)op.className="opcion pos";else if(cur===-1)op.className="opcion neg";
      op.onclick=(function(k,rn){return function(){
        var cur2=S.respuestas[k]||0;
        if(cur2===0){var posN=0;for(var cc=0;cc<4;cc++)if(S.respuestas[rn+"-"+cc]===1)posN++;if(posN>=1){S.respuestas[k]=-1;this.className="opcion neg";}else{S.respuestas[k]=1;this.className="opcion pos";}}
        else if(cur2===1){var negN=0;for(var cc2=0;cc2<4;cc2++)if(S.respuestas[rn+"-"+cc2]===-1)negN++;if(negN>=1){S.respuestas[k]=0;this.className="opcion";}else{S.respuestas[k]=-1;this.className="opcion neg";}}
        else{S.respuestas[k]=0;this.className="opcion";}updateProg();
      };})(key,r);
      row.appendChild(op);
    }
    wrap.appendChild(row);p.appendChild(wrap);
  });
  var sc=calcScore();var sr=pmk("div","score-row");
  ECOLS.forEach(function(e){var sb=pmk("div","score-box");var sv=pmk("span","score-val",String(sc[e]||0));sv.id="scv-"+e;sb.appendChild(sv);sb.appendChild(pmk("span","score-lbl","Col. "+["A","B","C","D"][ECOLS.indexOf(e)]));sr.appendChild(sb);});
  p.appendChild(sr);
  var nav=pmk("div","nav");
  var back=pmk("button","btn btn-ghost","← Anterior");back.onclick=function(){irA(0);};
  var calc=pmk("button","btn btn-primary","Ver mis resultados →");
  calc.onclick=function(){
    if(countOK()<10){alert("Completa todos los renglones antes de continuar. Te faltan "+(10-countOK())+".");return;}
    var scores=calcScore();
    if(scores.agua+scores.fuego+scores.tierra+scores.aire!==0){alert("La suma de todos los puntajes debe ser 0. Revisa tus respuestas.");return;}
    S.resultado=calcResultado(scores);buildResultado();irA(2);
  };
  nav.appendChild(back);nav.appendChild(calc);p.appendChild(nav);
}

function updateProg(){
  var n=countOK();var lbl=pge("prog-lbl");var fill=pge("prog-fill");
  if(lbl)lbl.textContent=n+" de 10 renglones completados";
  if(fill)fill.style.width=(n*10)+"%";
  var sc=calcScore();
  ECOLS.forEach(function(e){var v=pge("scv-"+e);if(v)v.textContent=String(sc[e]);});
}

  // Puntajes

  clid.appendChild(ltag);
  var ldesc=pmk("p");ldesc.style.cssText="font-size:13px;color:#3A4A5C;line-height:1.7";ldesc.textContent=perf.liderazgo.desc;
  clid.appendChild(ldesc);p.appendChild(clid);

  cfor.appendChild(ul);p.appendChild(cfor);

  // Sombras
  var csom=pmk("div","card");csom.appendChild(pmk("div","sec-label","Áreas de crecimiento personal"));
  var ul2=pmk("ul","char-list");
  perf.sombras.forEach(function(s){var li=document.createElement("li");var dot=pmk("div","char-dot");dot.style.background="#8A3A2E";li.appendChild(dot);li.appendChild(document.createTextNode(s));ul2.appendChild(li);});
  csom.appendChild(ul2);p.appendChild(csom);

  // Opuesto - doble lectura
  var copp=pmk("div","card");copp.appendChild(pmk("div","sec-label","Tu elemento opuesto: "+ELN[res.opuesto]+" — una doble lectura"));
  var obox1=pmk("div","opp-box");obox1.style.cssText="background:"+EBGCSS[res.opuesto]+";border-left:3px solid "+ECOLOR[res.opuesto]+";margin-bottom:10px;padding:14px 16px;border-radius:0 3px 3px 0";
  var ot1=pmk("div","opp-title");ot1.style.color=ECOLOR[res.opuesto];ot1.textContent="En el trabajo: tu maestro";
  var od1=pmk("p","opp-txt");od1.textContent=perf.opuesto_trabajo;
  obox1.appendChild(ot1);obox1.appendChild(od1);copp.appendChild(obox1);
  var obox2=pmk("div","opp-box");obox2.style.cssText="background:#F5EFE3;border-left:3px solid #C4973B;padding:14px 16px;border-radius:0 3px 3px 0";
  var ot2=pmk("div","opp-title");ot2.style.color="#8B5E1A";ot2.textContent="En el hogar: tu complemento ideal";
  var od2=pmk("p","opp-txt");od2.textContent=perf.opuesto_hogar;
  obox2.appendChild(ot2);obox2.appendChild(od2);copp.appendChild(obox2);
  p.appendChild(copp);

  // Actividades para potenciar talento
  var cact=pmk("div","card");cact.appendChild(pmk("div","sec-label","Actividades para potenciar tu talento"));
  var lact=pmk("div");
  perf.actividades.forEach(function(act,i){
    var row=pmk("div","act-item");
    var num=pmk("span","act-num");num.style.color=ec;num.textContent=String(i+1).padStart(2,"0");
    var txt=pmk("span");txt.textContent=act;

  cact.appendChild(lact);p.appendChild(cact);

  // Plan de acción personal

  cplan.appendChild(pdesc);
  perf.plan.forEach(function(paso,i){
    var row=pmk("div","act-item");
    var num=pmk("span","act-num");num.style.color=ec;num.textContent=["→ Semana 1","→ Mes 1","→ 3 meses","→ 6 meses"][i];

    row.appendChild(num);row.appendChild(txt);cplan.appendChild(row);
  });
  p.appendChild(cplan);

  // QR de resultados
  var qrbox=pmk("div","qr-box");

  qrbox.appendChild(pmk("div","",""));

function descargarFicha(){
  var r=S.resultado;
  var ficha={nombre:S.nombre,cargo:S.cargo,area:S.empresa,celular:S.celular,correo:S.correo,fecha:new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"}),agua:r.scores.agua,fuego:r.scores.fuego,tierra:r.scores.tierra,aire:r.scores.aire,principal:r.principal,complemento:r.complemento,opuesto:r.opuesto};
  var blob=new Blob([JSON.stringify(ficha,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;
  a.download="4elem_"+S.nombre.replace(/\s+/g,"_")+"_"+r.principal+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function generarQR(){
  var r=S.resultado;
  var ficha={nombre:S.nombre,cargo:S.cargo,area:S.empresa,celular:S.celular,correo:S.correo,
    fecha:new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"}),
    agua:r.scores.agua,fuego:r.scores.fuego,tierra:r.scores.tierra,aire:r.scores.aire,
    principal:r.principal,complemento:r.complemento,opuesto:r.opuesto};
  var json=JSON.stringify(ficha);
  var b64=btoa(unescape(encodeURIComponent(json)));
  var url="4E:"+b64;
  // Código corto de respaldo (6 chars)
  var code=S.nombre.trim().slice(0,3).toUpperCase()+String(Math.abs(r.scores.agua*7+r.scores.fuego*13+r.scores.tierra*11+r.scores.aire*17)%1000).padStart(3,"0");
  var ct=pge("qr-code-str");if(ct)ct.textContent=code;
  var qrdiv=pge("qr-resultado");
  if(!qrdiv)return;
  qrdiv.innerHTML="";
  try{
    new QRCode(qrdiv,{text:url,width:160,height:160,colorDark:"#0D1B2A",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  }catch(e){
    qrdiv.innerHTML="<div style=\"padding:20px;font-size:12px;color:#8A3A2E;\">Error generando QR. Usa la descarga .json</div>";
  }
}
function init(){
  var panels=pge("panels");panels.innerHTML="";
  STEPS.forEach(function(_,i){var pn=pmk("div","panel");pn.id="p"+i;panels.appendChild(pn);});
  renderStepBar();buildPresentacion();irA(0);
}
init();
