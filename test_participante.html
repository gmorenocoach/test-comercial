<style>
/* ── PANTALLA DE PROTECCIÓN ── */
.protect-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0D1B2A;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.protect-card{background:#1A3248;border:1px solid #2A4A68;border-radius:8px;padding:36px 28px;max-width:400px;width:100%;text-align:center}
.protect-logo{font-size:32px;margin-bottom:6px}
.protect-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px}
.protect-sub{font-size:13px;color:#8A9BB0;margin-bottom:22px;line-height:1.6}
.protect-inp{border:1px solid #2A4A68;border-radius:4px;padding:12px 16px;font-size:22px;font-family:inherit;background:#0D1B2A;color:#fff;width:100%;box-sizing:border-box;text-align:center;letter-spacing:6px;text-transform:uppercase;margin-bottom:10px}
.protect-inp:focus{outline:none;border-color:#C4973B}
.protect-btn{background:#C4973B;border:none;border-radius:4px;padding:12px 24px;font-size:14px;font-weight:700;color:#0D1B2A;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1px;width:100%;margin-bottom:4px}
.protect-btn:hover{background:#E8C07A}
.protect-err{font-size:12px;color:#E57373;min-height:18px;margin-top:6px}
.protect-closed .protect-logo{filter:grayscale(1);opacity:.5}
.protect-closed .protect-title{color:#8A9BB0}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Calibri',sans-serif;background:#EEF1F5;color:#1A1A2E;font-size:15px;min-height:100vh}
.topbar{background:#0D1B2A;display:flex;align-items:stretch}
.tb-accent{width:5px;background:#C4973B;flex-shrink:0}
.tb-text{padding:14px 20px}
.tb-text h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.4px;text-transform:uppercase}
.tb-text p{font-size:11px;color:#8A9BB0;margin-top:2px}
.app{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.step-bar{display:flex;align-items:center;margin-bottom:24px}
.sb-item{display:flex;align-items:center;gap:6px;flex:1}
.sb-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #D0D8E4;color:#B0BCC8;background:#fff;flex-shrink:0;transition:all .3s}
.sb-num.done{background:#0D1B2A;border-color:#0D1B2A;color:#fff}
.sb-num.act{background:#C4973B;border-color:#C4973B;color:#fff}
.sb-lbl{font-size:11px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.sb-lbl.act,.sb-lbl.done{color:#0D1B2A}
.sb-line{flex:1;height:2px;background:#D0D8E4;margin:0 8px}
.sb-line.done{background:#0D1B2A}
.panel{display:none}.panel.act{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid #D8DFE8;border-radius:4px;padding:20px 22px;margin-bottom:14px}
.card-accent{border-top:3px solid #0D1B2A}
.sec-label{font-size:10px;font-weight:700;color:#6B7A8D;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sec-title{font-size:22px;font-weight:700;color:#0D1B2A;margin-bottom:6px;line-height:1.2}
.sec-sub{font-size:14px;color:#6B7A8D;line-height:1.65}
.inp{border:1px solid #D0D8E4;border-radius:3px;padding:9px 12px;font-size:14px;font-family:inherit;background:#FAFBFC;color:#1A1A2E;width:100%}
.inp:focus{outline:none;border-color:#0D1B2A;background:#fff}
.btn{border:1px solid #D0D8E4;border-radius:3px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;transition:all .15s}
.btn-primary{background:#0D1B2A;color:#fff;border-color:#0D1B2A}
.btn-primary:hover{background:#1A3248}
.btn-ghost{background:#fff;color:#6B7A8D;border-color:#D0D8E4}
.btn-ghost:hover{border-color:#0D1B2A;color:#0D1B2A}
.test-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.col-head{text-align:center;padding:8px 4px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:#F4F6F8;color:#6B7A8D}
.renglon-wrap{margin-bottom:10px}
.renglon-num{font-size:10px;color:#B0BCC8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;text-align:center}
.renglon{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opcion{background:#F8F9FB;border:1.5px solid #E2E8F0;border-radius:3px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .18s;font-size:13px;color:#6B7A8D;user-select:none;position:relative;font-weight:500;line-height:1.3}
.opcion:hover{border-color:#0D1B2A;color:#0D1B2A;background:#fff}
.opcion.pos{border-color:#2E6B8A;background:#EAF3F8;color:#1A4F6B;font-weight:600}
.opcion.neg{border-color:#8A3A2E;background:#F8EDEA;color:#6B2820;font-weight:600}
.opcion.pos::after{content:"+1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#2E6B8A}
.opcion.neg::after{content:"-1";position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#8A3A2E}
.prog-wrap{margin-bottom:16px}
.prog-label{font-size:12px;color:#6B7A8D;margin-bottom:5px}
.prog-track{height:5px;background:#E2E8F0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#0D1B2A,#C4973B);border-radius:3px;transition:width .3s}
.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #E2E8F0}
.score-box{text-align:center;padding:10px 4px;border-radius:3px;border:1px solid #E2E8F0;background:#F8F9FB}
.score-val{font-size:22px;font-weight:700;display:block;line-height:1}
.score-lbl{font-size:9px;font-weight:700;color:#B0BCC8;text-transform:uppercase;letter-spacing:.6px;display:block;margin-top:4px}
/* RESULTADO */
.elem-hero{border-radius:4px;padding:26px 22px;margin-bottom:14px;border:2px solid;text-align:center}
.prop-block{padding:12px 14px;border-radius:3px;margin-bottom:10px;border-left:3px solid}
.prop-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.prop-txt{font-size:13px;color:#3A4A5C;line-height:1.65}
.char-list{list-style:none;padding:0}
.char-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #F0F2F5;font-size:13px;color:#3A4A5C;line-height:1.55}
.char-list li:last-child{border-bottom:none}
.char-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.act-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F0F2F5;font-size:13px;color:#3A4A5C;line-height:1.6}
.act-item:last-child{border-bottom:none}
.act-num{font-size:11px;font-weight:700;min-width:22px;flex-shrink:0;margin-top:1px}
.opp-box{border-radius:4px;padding:16px 18px;margin-bottom:10px}
.opp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.opp-txt{font-size:13px;line-height:1.65}

.qr-box{background:#fff;border:2px solid #C4973B;border-radius:4px;padding:20px 22px;text-align:center;margin-bottom:14px}
.qr-label{font-size:10px;font-weight:700;color:#0D1B2A;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.qr-sub{font-size:12px;color:#6B7A8D;margin-bottom:14px;line-height:1.6}
.qr-canvas{display:inline-block;padding:14px;background:#fff;border:2px solid #0D1B2A;border-radius:4px;margin-bottom:12px}
.qr-code-txt{font-size:11px;font-weight:700;color:#0D1B2A;background:#F4F6F8;padding:6px 14px;border-radius:3px;letter-spacing:2px;display:inline-block}

.download-box{background:#0D1B2A;border-radius:4px;padding:20px 22px;text-align:center;margin-bottom:14px}
.dl-label{font-size:10px;font-weight:700;color:#C4973B;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.dl-text{font-size:12px;color:#8A9BB0;margin-bottom:14px;line-height:1.6}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid #E2E8F0;gap:10px}
.note-box{background:#F5EFE3;border-left:3px solid #C4973B;border-radius:0 3px 3px 0;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#3A4A5C;line-height:1.6}
.map-row{display:flex;gap:10px;margin-bottom:10px}
.map-badge{flex:1;text-align:center;padding:12px 8px;border-radius:3px;border:1px solid}
.map-badge-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px}
.map-badge-val{font-size:15px;font-weight:700;display:block}
.liderazgo-tag{display:inline-block;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

function pge(id){return document.getElementById(id);}
function pmk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d;}

function calcScore(){var sc={agua:0,fuego:0,tierra:0,aire:0};Object.keys(S.respuestas).forEach(function(k){var p=k.split("-"),elem=ECOLS[parseInt(p[1])];sc[elem]+=S.respuestas[k];});return sc;}
function renglonOK(r){var pos=0,neg=0;for(var c=0;c<4;c++){var v=S.respuestas[r+"-"+c];if(v===1)pos++;if(v===-1)neg++;}return pos===1&&neg===1;}
function countOK(){var n=0;for(var r=0;r<10;r++)if(renglonOK(r))n++;return n;}
function calcResultado(sc){
  var orden=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[b]-sc[a];});
  var negs=["agua","fuego","tierra","aire"].sort(function(a,b){return sc[a]-sc[b];});
  return{scores:sc,principal:orden[0],complemento:orden[1],opuesto:negs[0]};
}

function descargarFicha(){
  var r=S.resultado;
  var ficha={nombre:S.nombre,cargo:S.cargo,area:S.empresa,celular:S.celular,correo:S.correo,fecha:new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"}),agua:r.scores.agua,fuego:r.scores.fuego,tierra:r.scores.tierra,aire:r.scores.aire,principal:r.principal,complemento:r.complemento,opuesto:r.opuesto};
  var blob=new Blob([JSON.stringify(ficha,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;
  a.download="4elem_"+S.nombre.replace(/\s+/g,"_")+"_"+r.principal+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function generarQR(){
  var r=S.resultado;
  var ficha={nombre:S.nombre,cargo:S.cargo,area:S.empresa,celular:S.celular,correo:S.correo,
    fecha:new Date().toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"}),
    agua:r.scores.agua,fuego:r.scores.fuego,tierra:r.scores.tierra,aire:r.scores.aire,
    principal:r.principal,complemento:r.complemento,opuesto:r.opuesto};
  var json=JSON.stringify(ficha);
  var b64=btoa(unescape(encodeURIComponent(json)));
  var url="4E:"+b64;
  // Código corto de respaldo (6 chars)
  var code=S.nombre.trim().slice(0,3).toUpperCase()+String(Math.abs(r.scores.agua*7+r.scores.fuego*13+r.scores.tierra*11+r.scores.aire*17)%1000).padStart(3,"0");
  var ct=pge("qr-code-str");if(ct)ct.textContent=code;
  var qrdiv=pge("qr-resultado");
  if(!qrdiv)return;
  qrdiv.innerHTML="";
  try{
    new QRCode(qrdiv,{text:url,width:200,height:200,colorDark:"#0D1B2A",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.L});
  }catch(e){
    qrdiv.innerHTML="<div style=\"padding:20px;font-size:12px;color:#8A3A2E;\">Error generando QR. Usa la descarga .json</div>";
  }
}
// ── PROTECCIÓN DEL TALLER ──────────────────────────────────────
// Configuración del taller — actualiza estos valores antes de cada sesión
// También puedes cambiarlos desde el panel del facilitador (pestaña Configurar)
var TALLER_CONFIG = {
  codigo: "SOY2026",            // Código verbal que das al inicio del taller
  inicio: "2026-10-08T06:00",   // Hora de apertura (Colombia, UTC-5)
  fin:    "2026-10-08T23:59",   // Hora de cierre
  nombre: "Taller Comercial Soy Integral"
};

function _cfg_tz(dt){ return new Date(dt + ":00-05:00"); }

function verificarAcceso(){
  var err = document.getElementById('protect-err');
  var inp = document.getElementById('protect-code');
  var card = document.getElementById('protect-card');
  var msg = document.getElementById('protect-msg');
  var ahora = new Date();
  var ini = _cfg_tz(TALLER_CONFIG.inicio);
  var fin = _cfg_tz(TALLER_CONFIG.fin);

  if(ahora < ini){
    var diff = Math.round((ini - ahora)/60000);
    var hrs=Math.floor(diff/60), mins=diff%60;
    card.className='protect-card protect-closed';
    msg.innerHTML='El taller aún no ha comenzado.<br><b>Disponible en '+(hrs>0?hrs+'h ':'')+mins+' min.</b>';
    inp.style.display='none'; document.querySelector('.protect-btn').style.display='none';
    return;
  }
  if(ahora > fin){
    card.className='protect-card protect-closed';
    msg.innerHTML='La sesión de este taller ya cerró.<br>Contacta a tu facilitador.';
    inp.style.display='none'; document.querySelector('.protect-btn').style.display='none';
    return;
  }
  var codigo=(inp.value||'').trim().toUpperCase();
  if(codigo===TALLER_CONFIG.codigo.toUpperCase()){
    document.getElementById('protect-screen').style.display='none';
    err.textContent='';
  } else {
    err.textContent='Código incorrecto. Pídelo a tu facilitador.';
    inp.value=''; inp.focus();
  }
}

window.addEventListener('DOMContentLoaded',function(){
  var ahora=new Date();
  var ini=_cfg_tz(TALLER_CONFIG.inicio);
  var fin=_cfg_tz(TALLER_CONFIG.fin);
  var card=document.getElementById('protect-card');
  var msg=document.getElementById('protect-msg');
  var inp=document.getElementById('protect-code');
  var btn=document.querySelector('.protect-btn');
  if(ahora>fin){
    card.className='protect-card protect-closed';
    msg.innerHTML='La sesión de este taller ya cerró.<br>Contacta a tu facilitador.';
    inp.style.display='none'; btn.style.display='none';
  } else if(ahora<ini){
    var diff=Math.round((ini-ahora)/60000);
    var hrs=Math.floor(diff/60),mins=diff%60;
    msg.innerHTML=TALLER_CONFIG.nombre+'<br>El taller comienza en <b>'+(hrs>0?hrs+'h ':'')+mins+' min</b>.';
    inp.style.display='none'; btn.style.display='none';
  } else {
    msg.innerHTML=TALLER_CONFIG.nombre+'<br>Ingresa el código que te dio el facilitador';
    setTimeout(function(){inp.focus();},200);
  }
});

  var panels=pge("panels");panels.innerHTML="";
  STEPS.forEach(function(_,i){var pn=pmk("div","panel");pn.id="p"+i;panels.appendChild(pn);});
  renderStepBar();buildPresentacion();irA(0);
}
init();
